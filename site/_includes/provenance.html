<div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-[var(--color-ink)]/75">
  <span>
    Dados Airbnb:
    <time
      class="whitespace-nowrap"
      {% if site.data.site.source_dates.airbnb_snapshot_date %}
        datetime="{{ site.data.site.source_dates.airbnb_snapshot_date }}"
      {% endif %}
    >
      {{- site.data.site.source_dates.airbnb_snapshot_date | default: '???' -}}
    </time>
  </span>
  <span>
    Registo descarregado:
    <time
      class="whitespace-nowrap"
      {% if site.data.site.source_dates.rnal_fetched_on %}
        datetime="{{ site.data.site.source_dates.rnal_fetched_on }}"
      {% endif %}
    >
      {{- site.data.site.source_dates.rnal_fetched_on | default: '???' -}}
    </time>
  </span>
</div>
