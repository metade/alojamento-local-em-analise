{% assign m = include.metrics %}
<figure class="m-0 min-w-0 border border-[var(--color-line)] bg-white/50 p-5 sm:p-8">
  {% assign g = m.geometry %}
  {% assign diagram_id = m.geography | slugify | prepend: 'overlap-' %}
  {% assign left_edge = g.x | minus: g.r %}
  {% assign right_edge = g.y | minus: g.s %}
  {% assign rnal_diameter = g.r | times: 2 %}
  {% assign airbnb_diameter = g.s | times: 2 %}
  {% assign rnal_offset = g.r | times: 0.70710678 %}
  {% assign airbnb_offset = g.s | times: 0.70710678 %}
  {% assign rnal_tip_x = g.x | minus: rnal_offset %}
  {% assign rnal_tip_y = 265 | minus: rnal_offset %}
  {% assign airbnb_tip_x = g.y | plus: airbnb_offset %}
  {% assign airbnb_tip_y = 265 | minus: airbnb_offset %}
  <svg
    class="overlap-diagram block w-full"
    viewBox="0 0 640 480"
    role="group"
    aria-label="Registos RNAL e candidatos Airbnb, contando cada número comum uma vez. Foque uma legenda para destacar o conjunto."
  >
    {% if m.geometry %}
    <defs>
      <clipPath id="{{ diagram_id }}-airbnb">
        <circle cx="{{ g.y }}" cy="190" r="{{ g.s }}" />
      </clipPath>
      <clipPath id="{{ diagram_id }}-exclusive">
        <path clip-rule="evenodd" d="M {{ left_edge }} 190 a {{ g.r }} {{ g.r }} 0 1 0 {{ rnal_diameter }} 0 a {{ g.r }} {{ g.r }} 0 1 0 -{{ rnal_diameter }} 0 Z M {{ right_edge }} 190 a {{ g.s }} {{ g.s }} 0 1 0 {{ airbnb_diameter }} 0 a {{ g.s }} {{ g.s }} 0 1 0 -{{ airbnb_diameter }} 0 Z" />
      </clipPath>
    </defs>
    <g class="overlap-total overlap-total--rnal" data-overlap="rnal-total" tabindex="0" role="img" aria-label="RNAL: {{ m.rnal | pt_count: 'número', 'números' }}">
      <text x="30" y="25">RNAL<tspan x="30" dy="34" class="overlap-total-value">{{ m.rnal | pt_count: 'número', 'números' }}</tspan></text>
      {% if m.rnal > 0 %}
        <path class="overlap-total-leader" d="M 150 76 L 150 {{ rnal_tip_y | minus: 22 }} L {{ rnal_tip_x }} {{ rnal_tip_y }}" />
        <path class="overlap-total-arrow" d="M {{ rnal_tip_x | minus: 10 }} {{ rnal_tip_y | minus: 3 }} L {{ rnal_tip_x }} {{ rnal_tip_y }} L {{ rnal_tip_x | minus: 2 }} {{ rnal_tip_y | minus: 10 }}" />
      {% endif %}
    </g>
    <g class="overlap-total overlap-total--airbnb" data-overlap="airbnb-total" tabindex="0" role="img" aria-label="Airbnb: {{ m.airbnb | pt_count: 'candidato', 'candidatos' }}">
      <text x="380" y="25">Airbnb<tspan x="380" dy="34" class="overlap-total-value">{{ m.airbnb | pt_count: 'candidato', 'candidatos' }}</tspan></text>
      {% if m.airbnb > 0 %}
        <path class="overlap-total-leader" d="M 490 76 L 490 {{ airbnb_tip_y | minus: 22 }} L {{ airbnb_tip_x }} {{ airbnb_tip_y }}" />
        <path class="overlap-total-arrow" d="M {{ airbnb_tip_x | plus: 10 }} {{ airbnb_tip_y | minus: 3 }} L {{ airbnb_tip_x }} {{ airbnb_tip_y }} L {{ airbnb_tip_x | plus: 2 }} {{ airbnb_tip_y | minus: 10 }}" />
      {% endif %}
    </g>
    <g transform="translate(0 75)">
      <circle cx="{{ g.x }}" cy="190" r="{{ g.r }}" class="overlap-base overlap-base--rnal" />
      <circle cx="{{ g.y }}" cy="190" r="{{ g.s }}" class="overlap-base overlap-base--airbnb" />
      <circle cx="{{ g.x }}" cy="190" r="{{ g.r }}" clip-path="url(#{{ diagram_id }}-exclusive)" class="overlap-region overlap-region--rnal" data-overlap="rnal" aria-hidden="true" />
      <circle cx="{{ g.y }}" cy="190" r="{{ g.s }}" clip-path="url(#{{ diagram_id }}-exclusive)" class="overlap-region overlap-region--airbnb" data-overlap="airbnb" aria-hidden="true" />
      <circle cx="{{ g.x }}" cy="190" r="{{ g.r }}" clip-path="url(#{{ diagram_id }}-airbnb)" class="overlap-region overlap-region--common" data-overlap="common" aria-hidden="true" />
    {% for label in m.overlap_labels %}
      {% if label.count > 0 %}
        <g class="overlap-label overlap-label--{{ label.key }}" data-overlap="{{ label.key }}" tabindex="0" role="img" aria-label="{{ label.title }}: {% if label.key == 'airbnb' %}{{ label.count | pt_count: 'candidato', 'candidatos' }}{% else %}{{ label.count | pt_count: 'número AL', 'números AL' }}{% endif %}">
          {% if label.callout %}
            <path d="M {{ label.target }} 205 L {{ label.target }} 270 L {{ label.x }} {{ label.y | minus: 48 }}" />
            <circle cx="{{ label.target }}" cy="205" r="3" />
          {% endif %}
          <text x="{{ label.x }}" y="{{ label.y }}" text-anchor="middle">
            <tspan class="overlap-value" x="{{ label.x }}">{{ label.count | pt_number }}</tspan>
            <tspan x="{{ label.x }}" dy="26">{{ label.title }}</tspan>
          </text>
        </g>
      {% endif %}
    {% endfor %}
    </g>
    {% else %}
      <g class="overlap-total overlap-total--rnal"><text x="30" y="25">RNAL<tspan x="30" dy="34" class="overlap-total-value">{{ m.rnal | pt_count: 'número', 'números' }}</tspan></text></g>
      <g class="overlap-total overlap-total--airbnb"><text x="380" y="25">Airbnb<tspan x="380" dy="34" class="overlap-total-value">{{ m.airbnb | pt_count: 'candidato', 'candidatos' }}</tspan></text></g>
      <g class="overlap-label"><text x="320" y="265" text-anchor="middle"><tspan class="overlap-value">{{ m.matched_al_numbers | pt_number }} números nas duas fontes</tspan><tspan x="320" dy="30">{{ m.remaining_candidates | pt_number }} restantes candidatos</tspan></text></g>
    {% endif %}
  </svg>
  <div class="candidate-breakdown mt-6 border-t border-[var(--color-line)] pt-5 text-sm">
    <p class="font-semibold">
      Composição dos {{ m.airbnb | pt_count: 'candidato Airbnb', 'candidatos Airbnb' }}
    </p>
    {% if m.airbnb > 0 %}
      <div
        class="candidate-breakdown-bar"
        role="group"
        aria-label="Distribuição de 100% dos candidatos Airbnb"
      >
        {% for category in m.candidate_breakdown %}
          {% if category.count > 0 %}
            <span
              class="candidate-breakdown-segment candidate-breakdown--{{ category.key }}"
              style="width:{{ category.width }}%"
              tabindex="0"
              role="img"
              aria-label="{{ category.label | escape }}: {{ category.count | pt_count: 'candidato', 'candidatos' }}"
              title="{{ category.label | escape }}: {{ category.count | pt_number }}"
            ></span>
          {% endif %}
        {% endfor %}
      </div>
    {% else %}
      <p>Não há candidatos nesta geografia.</p>
    {% endif %}
    <ul class="candidate-breakdown-legend">
      {% for category in m.candidate_breakdown %}
        <li>
          <span
            class="candidate-breakdown-swatch candidate-breakdown--{{ category.key }}"
            aria-hidden="true"
          ></span>
          <span>{{ category.label | escape }}</span>
          <strong>{{ category.count | pt_number }}</strong>
        </li>
      {% endfor %}
    </ul>
  </div>
  <figcaption class="mt-6 border-t border-[var(--color-line)] pt-5 text-sm text-[var(--color-ink)]/75">
    <p class="mt-0!">
      RNAL conta números de registo e Airbnb conta candidatos estimados. A sobreposição conta cada
      número AL presente nas duas fontes uma única vez. A área «Restantes candidatos» é o total
      Airbnb menos esses números comuns; inclui reutilizações e candidatos sem número.
    </p>
    <details>
      <summary class="cursor-pointer font-semibold text-[var(--color-ink)] underline underline-offset-4">
        Como interpretar estes números
      </summary>
      <p>
        A barra reparte todos os candidatos, sem duplicações: uma ocorrência por número é contada em
        «Número no RNAL» ou «Número fora do RNAL desta geografia»; as ocorrências adicionais ficam
        em reutilização. Não escolhemos qual dos candidatos representa corretamente o registo.
        Encontrar um número no RNAL não confirma a identidade nem a legalidade do alojamento.
      </p>
      <p>
        Números reconhecidos fora do RNAL desta geografia podem existir noutra freguesia ou
        município, ou não ser encontrados nacionalmente. A correspondência usa as linhas originais
        que declaram Lisboa e, nas freguesias, a mesma freguesia oficial, mesmo com conflitos na
        resolução nacional. As contagens de números e reutilizações por freguesia não são
        necessariamente aditivas.
      </p>
      <p>
        As isenções são declarações por verificar. Ainda não avaliamos se são corretas ou
        incorretas; por isso aparecem numa única categoria, sem presumir validade. A classificação e
        o agrupamento de candidatos sem número permanecem trabalho de investigação.
      </p>
    </details>
  </figcaption>
</figure>
