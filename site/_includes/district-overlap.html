{% assign m = include.metrics %}
<figure class="m-0 min-w-0 border border-[var(--color-line)] bg-white/50 p-5 sm:p-8">
  {% assign g = m.geometry %}
  {% assign diagram_id = m.geography | slugify | prepend: 'overlap-' %}
  {% assign left_edge = g.x | minus: g.r %}
  {% assign right_edge = g.y | minus: g.s %}
  {% assign rnal_diameter = g.r | times: 2 %}
  {% assign airbnb_diameter = g.s | times: 2 %}
  {% assign rnal_offset = g.r | times: 0.70710678 %}
  {% assign airbnb_offset = g.s | times: 0.70710678 %}
  {% assign rnal_tip_x = g.x | minus: rnal_offset %}
  {% assign rnal_tip_y = 265 | minus: rnal_offset %}
  {% assign airbnb_tip_x = g.y | plus: airbnb_offset %}
  {% assign airbnb_tip_y = 265 | minus: airbnb_offset %}
  <svg
    class="overlap-diagram block w-full"
    viewBox="0 0 640 640"
    role="group"
    aria-label="Números de registo AL nas duas fontes. Foque uma legenda para destacar o conjunto."
  >
    <defs>
      <clipPath id="{{ diagram_id }}-airbnb">
        <circle cx="{{ g.y }}" cy="190" r="{{ g.s }}" />
      </clipPath>
      <clipPath id="{{ diagram_id }}-exclusive">
        <path clip-rule="evenodd" d="M {{ left_edge }} 190 a {{ g.r }} {{ g.r }} 0 1 0 {{ rnal_diameter }} 0 a {{ g.r }} {{ g.r }} 0 1 0 -{{ rnal_diameter }} 0 Z M {{ right_edge }} 190 a {{ g.s }} {{ g.s }} 0 1 0 {{ airbnb_diameter }} 0 a {{ g.s }} {{ g.s }} 0 1 0 -{{ airbnb_diameter }} 0 Z" />
      </clipPath>
    </defs>
    <g class="overlap-total overlap-total--rnal" data-overlap="rnal-total" tabindex="0" role="img" aria-label="RNAL: {{ m.rnal | pt_number }} números">
      <text x="30" y="25">RNAL<tspan x="30" dy="34" class="overlap-total-value">{{ m.rnal | pt_number }} números</tspan></text>
      {% if m.rnal > 0 %}
        <path class="overlap-total-leader" d="M 150 76 L 150 {{ rnal_tip_y | minus: 22 }} L {{ rnal_tip_x }} {{ rnal_tip_y }}" />
        <path class="overlap-total-arrow" d="M {{ rnal_tip_x | minus: 10 }} {{ rnal_tip_y | minus: 3 }} L {{ rnal_tip_x }} {{ rnal_tip_y }} L {{ rnal_tip_x | minus: 2 }} {{ rnal_tip_y | minus: 10 }}" />
      {% endif %}
    </g>
    <g class="overlap-total overlap-total--airbnb" data-overlap="airbnb-total" tabindex="0" role="img" aria-label="Airbnb: {{ m.airbnb | pt_number }} números">
      <text x="380" y="25">Airbnb<tspan x="380" dy="34" class="overlap-total-value">{{ m.airbnb | pt_number }} números</tspan></text>
      {% if m.airbnb > 0 %}
        <path class="overlap-total-leader" d="M 490 76 L 490 {{ airbnb_tip_y | minus: 22 }} L {{ airbnb_tip_x }} {{ airbnb_tip_y }}" />
        <path class="overlap-total-arrow" d="M {{ airbnb_tip_x | plus: 10 }} {{ airbnb_tip_y | minus: 3 }} L {{ airbnb_tip_x }} {{ airbnb_tip_y }} L {{ airbnb_tip_x | plus: 2 }} {{ airbnb_tip_y | minus: 10 }}" />
      {% endif %}
    </g>
    <g transform="translate(0 75)">
      <circle cx="{{ g.x }}" cy="190" r="{{ g.r }}" class="overlap-base overlap-base--rnal" />
      <circle cx="{{ g.y }}" cy="190" r="{{ g.s }}" class="overlap-base overlap-base--airbnb" />
      <circle cx="{{ g.x }}" cy="190" r="{{ g.r }}" clip-path="url(#{{ diagram_id }}-exclusive)" class="overlap-region overlap-region--rnal" data-overlap="rnal" aria-hidden="true" />
      <circle cx="{{ g.y }}" cy="190" r="{{ g.s }}" clip-path="url(#{{ diagram_id }}-exclusive)" class="overlap-region overlap-region--airbnb" data-overlap="airbnb" aria-hidden="true" />
      <circle cx="{{ g.x }}" cy="190" r="{{ g.r }}" clip-path="url(#{{ diagram_id }}-airbnb)" class="overlap-region overlap-region--common" data-overlap="common" aria-hidden="true" />
    {% for label in m.overlap_labels %}
      {% if label.count > 0 %}
        <g class="overlap-label overlap-label--{{ label.key }}" data-overlap="{{ label.key }}" tabindex="0" role="img" aria-label="{{ label.title }}: {{ label.count | pt_number }} números">
          {% if label.callout %}
            <path d="M {{ label.target }} 205 L {{ label.target }} 270 L {{ label.x }} {{ label.y | minus: 48 }}" />
            <circle cx="{{ label.target }}" cy="205" r="3" />
          {% endif %}
          <text x="{{ label.x }}" y="{{ label.y }}" text-anchor="middle">
            <tspan class="overlap-value" x="{{ label.x }}">{{ label.count | pt_number }}</tspan>
            <tspan x="{{ label.x }}" dy="26">{{ label.title }}</tspan>
          </text>
        </g>
      {% endif %}
    {% endfor %}
    </g>
    <g class="overlap-label overlap-label--unresolved" data-overlap="unresolved" tabindex="0" role="img" aria-label="{{ m.unresolved | pt_number }} anúncios sem número identificável, numa escala separada dos números de registo">
      <circle class="overlap-unresolved-bubble" cx="520" cy="540" r="{{ m.bubble_radius }}" />
      <text x="55" y="535">
        <tspan class="overlap-value" x="55">{{ m.unresolved | pt_number }} anúncios</tspan>
        <tspan x="55" dy="28">Sem número identificável</tspan>
      </text>
      {% if m.unresolved > 0 %}
        <path d="M 370 540 L {{ 520 | minus: m.bubble_radius }} 540" />
      {% endif %}
    </g>
  </svg>
  <figcaption class="mt-6 border-t border-[var(--color-line)] pt-5 text-sm text-[var(--color-ink)]/75">
    <p class="mt-0!">
      Círculos e sobreposição proporcionais aos números de registo AL distintos nesta geografia. A
      bolha amarela representa a fração de anúncios sem número identificável, noutra escala.
    </p>
    <details>
      <summary class="cursor-pointer font-semibold text-[var(--color-ink)] underline underline-offset-4">
        Como interpretar estes números
      </summary>
      <p>
        «Só no RNAL» significa ausente do Airbnb nesta geografia; pode aparecer noutra. «Só no
        Airbnb» pode ter registo nacional noutra localização.
      </p>
      <ul class="space-y-1">
        <li>
          Registo noutra freguesia de Lisboa:
          <strong>{{ m.another_lisbon_parish | pt_number }}</strong>
        </li>
        <li>
          Registo noutro município:
          <strong>{{ m.another_municipality | pt_number }}</strong>
        </li>
        <li>
          Sem correspondência nacional:
          <strong>{{ m.no_national_match | pt_number }}</strong>
        </li>
        <li>
          Geografia oficial por resolver:
          <strong>{{ m.unresolved_official_geography | pt_number }}</strong>
        </li>
      </ul>
      {% if m.observed_unknown_parish > 0 or m.official_unknown_parish > 0 %}
        <p>
          Freguesia por resolver: {{ m.observed_unknown_parish | pt_number }} anúncios e
          {{ m.official_unknown_parish | pt_number }} entradas oficiais de Lisboa. Incluídos no
          total municipal, sem atribuição a uma freguesia conhecida.
        </p>
      {% endif %}
      <p class="mt-4">
        Dos {{ m.announcements | pt_number }} anúncios: {{ m.empty_licence | pt_number }} têm campo
        vazio, {{ m.unrecognised_licence | pt_number }} têm valor não reconhecido e
        {{ m.identifiable_number | pt_number }} têm número identificável. Destes últimos,
        {{ m.confirmed_rnal_match | pt_number }} correspondem a um número no RNAL nacional datado.
      </p>
    </details>
  </figcaption>
</figure>
