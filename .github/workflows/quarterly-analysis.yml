name: Análise trimestral

on:
  schedule:
    - cron: '0 7 1 1,4,7,10 *'
  workflow_dispatch:

concurrency:
  group: public-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@866b91cc020931c510d42e43e498a7f07d335f60 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Testes
        run: bundle exec rake test
      - name: Executar análise pública
        env:
          REUSE_EXISTING: '1'
        run: bundle exec rake analysis:public
      - name: Preparar e validar outputs públicos
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/snapshots data/history
          bundle exec ruby scripts/audit_publication.rb
      - name: Registar outputs públicos no histórico Git
        run: |
          git diff --cached --quiet || git commit -m "Atualiza análise trimestral"
          git push
      - name: Construir site público
        env:
          JEKYLL_BASEURL: /alojamento-local-em-analise
        run: |
          npm ci
          bundle exec rake site:build
      - name: Verificar estrutura do site
        run: bundle exec rake site:check
      - name: Gate do artefacto de publicação
        run: bundle exec ruby scripts/audit_publication.rb --artifact _site
      - name: Upload do site sanitizado
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
