name: Auditoria de publicação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@866b91cc020931c510d42e43e498a7f07d335f60 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar ferramentas frontend
        run: npm ci
      - name: Verificar formatação dos templates
        run: npm run site:lint
      - name: Verificar outputs publicáveis
        run: bundle exec ruby scripts/audit_publication.rb
